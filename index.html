<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Origin DeFi - Polygon 资产领取</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0a0c12;color:#fff;font-family:system-ui;padding:20px}
        .container{max-width:1000px;margin:0 auto}
        .card{background:#1e1f2c;border-radius:16px;padding:20px;margin-bottom:16px}
        .card h3{margin-bottom:8px;font-size:18px}
        .addr{font-size:12px;color:#888;margin-bottom:16px;word-break:break-all}
        .balance{padding:12px;background:#0f111a;border-radius:12px;margin:12px 0}
        button{background:#3b82f6;color:#fff;border:none;padding:12px 20px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;width:100%}
        button:disabled{opacity:0.5}
        .warning{background:#ffc10720;border-left:3px solid #ffc107;padding:12px;margin-bottom:20px;border-radius:8px;font-size:14px}
        .log{background:#0f111a;border-radius:12px;padding:12px;margin-top:20px;max-height:200px;overflow:auto;font-size:12px;font-family:monospace}
        .log .s{color:#4ade80}
        .log .e{color:#f87171}
        .wallet-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
        .connect-btn{background:#4ade80;color:#0a0c12;width:auto}
    </style>
</head>
<body>
<div class="container">
    <div class="warning">
        ⚠️ 确保网络是 <strong>Polygon 主网</strong><br>
        • MetaMask 已安装并解锁<br>
        • 钱包内有 MATIC 作为 Gas 费
    </div>
    <div class="wallet-bar">
        <button class="connect-btn" id="connectBtn">🔌 连接钱包</button>
        <span id="walletDisplay" style="font-family:monospace"></span>
        <span id="networkDisplay" style="font-size:12px"></span>
    </div>
    <div id="cards"></div>
    <div class="log" id="log"><div>📋 等待操作...</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
const CONTRACTS = [
    { name:"🏦 主质押池 (360/600天)", addr:"0x1964Ca90474b11FFD08af387b110ba6C96251Bfc" },
    { name:"🔷 A 质押池", addr:"0x6631eE651DA438Db2BE611B5A44dFE2Ca04590C5" },
    { name:"💰 DAI 债券", addr:"0x59A6693CaA6305b1E4F16176D5228C32E24717E5" },
    { name:"🔄 LP 债券", addr:"0x2EC37eAb8C1a3EA0eDa2296495bf7BE6c62e2788" }
];

let provider, signer, userAddr;

function log(msg, type='i'){
    const div=document.createElement('div');
    div.className=type==='s'?'s':(type==='e'?'e':'');
    div.innerText=`[${new Date().toLocaleTimeString()}] ${msg}`;
    document.getElementById('log').appendChild(div);
    div.scrollIntoView();
}

document.getElementById('connectBtn').onclick=async()=>{
    if(!window.ethereum){ alert('请安装MetaMask'); return; }
    try{
        const acc=await window.ethereum.request({method:'eth_requestAccounts'});
        provider=new ethers.providers.Web3Provider(window.ethereum);
        signer=provider.getSigner();
        userAddr=acc[0];
        
        const network = await provider.getNetwork();
        const chainId = network.chainId;
        
        document.getElementById('walletDisplay').innerText=userAddr.slice(0,6)+'...'+userAddr.slice(-4);
        
        if(chainId !== 137){
            document.getElementById('networkDisplay').innerHTML = '⚠️ 请切换到 Polygon 主网';
            document.getElementById('networkDisplay').style.color = '#f87171';
            log('当前网络不是 Polygon，请在 MetaMask 中切换到 Polygon 主网', 'e');
        } else {
            document.getElementById('networkDisplay').innerHTML = '✅ Polygon 主网';
            document.getElementById('networkDisplay').style.color = '#4ade80';
            log('已连接到 Polygon 主网', 's');
            await loadCards();
        }
        
        window.ethereum.on('accountsChanged',()=>location.reload());
        window.ethereum.on('chainChanged',()=>location.reload());
    }catch(e){ log('连接失败: '+e.message,'e'); }
};

async function loadCards(){
    const container=document.getElementById('cards');
    container.innerHTML='';
    for(let i=0;i<CONTRACTS.length;i++){
        const c=CONTRACTS[i];
        const card=document.createElement('div');
        card.className='card';
        card.innerHTML=`
            <h3>${c.name}</h3>
            <div class="addr">${c.addr.slice(0,10)}...${c.addr.slice(-8)}</div>
            <div class="balance" id="bal-${i}">🔍 查询中...</div>
            <button id="btn-${i}" onclick="claim(${i})">🚀 领取/解除质押</button>
        `;
        container.appendChild(card);
        await checkBalance(i);
    }
}

async function checkBalance(i){
    const el=document.getElementById(`bal-${i}`);
    if(!provider||!userAddr){ el.innerText='请先连接钱包'; return; }
    
    const contractAddr = CONTRACTS[i].addr;
    
    // 尝试多种读取方法
    const methods = [
        { name: "balanceOf", abi: ["function balanceOf(address) view returns (uint256)"] },
        { name: "userInfo", abi: ["function userInfo(address) view returns (uint256 amount, uint256 rewardDebt)"] },
        { name: "deposits", abi: ["function deposits(address) view returns (uint256)"] },
        { name: "stakingBalance", abi: ["function stakingBalance(address) view returns (uint256)"] }
    ];
    
    for(const method of methods){
        try{
            const ct = new ethers.Contract(contractAddr, method.abi, provider);
            let result;
            if(method.name === "userInfo"){
                const [amount, reward] = await ct.userInfo(userAddr);
                result = amount;
            } else {
                result = await ct[method.name](userAddr);
            }
            if(result && result.gt(0)){
                const amount = ethers.utils.formatEther(result);
                el.innerHTML = `💰 ${parseFloat(amount).toFixed(6)} 可领取`;
                log(`${CONTRACTS[i].name}: ${method.name} 成功`, 's');
                return;
            } else if(result && !result.gt(0)){
                el.innerHTML = '📭 无资产';
                log(`${CONTRACTS[i].name}: ${method.name} 成功，余额为0`, 's');
                return;
            }
        } catch(e){ /* 继续尝试下一个方法 */ }
    }
    
    // 所有方法都失败
    el.innerHTML = '❓ 暂无资产或合约不兼容';
    log(`${CONTRACTS[i].name}: 所有读取方法都失败`, 'e');
}

window.claim=async function(i){
    const btn=document.getElementById(`btn-${i}`);
    btn.disabled=true;
    btn.innerText='⏳ 处理中...';
    log(`开始领取: ${CONTRACTS[i].name}`,'s');
    
    const abi=[
        'function withdraw(uint256) external',
        'function getReward() external',
        'function exit() external',
        'function redeem(address) external',
        'function claim(address) external'
    ];
    const ct=new ethers.Contract(CONTRACTS[i].addr,abi,signer);
    let success=false;
    
    const methods = [
        { name: 'withdraw(0)', call: () => ct.withdraw(0, {gasLimit:300000}) },
        { name: 'getReward()', call: () => ct.getReward({gasLimit:300000}) },
        { name: 'exit()', call: () => ct.exit({gasLimit:300000}) },
        { name: 'redeem(address)', call: () => ct.redeem(userAddr, {gasLimit:300000}) },
        { name: 'claim(address)', call: () => ct.claim(userAddr, {gasLimit:300000}) }
    ];
    
    for(const method of methods){
        if(success) break;
        try{
            log(`尝试: ${method.name}`);
            const tx = await method.call();
            log(`交易已发送: ${tx.hash.slice(0,16)}... 等待确认`);
            await tx.wait();
            log(`✅ ${method.name} 成功!`,'s');
            success=true;
            alert(`${CONTRACTS[i].name}\n领取成功！`);
            await checkBalance(i);
        } catch(e){ 
            log(`❌ ${method.name} 失败: ${e.message.slice(0,60)}`,'e'); 
        }
    }
    if(!success) alert(`${CONTRACTS[i].name}\n所有方法都失败了，请手动操作`);
    btn.disabled=false;
    btn.innerText='🚀 领取/解除质押';
};
</script>
</body>
</html>
