<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Origin DeFi - 资产一键领取（全钱包兼容）</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{background:#0a0c12;color:#fff;font-family:system-ui;padding:20px}
        .container{max-width:1000px;margin:0 auto}
        .card{background:#1e1f2c;border-radius:16px;padding:20px;margin-bottom:16px}
        .card h3{margin-bottom:8px;font-size:18px}
        .addr{font-size:12px;color:#888;margin-bottom:16px;word-break:break-all}
        .balance{padding:12px;background:#0f111a;border-radius:12px;margin:12px 0}
        button{background:#3b82f6;color:#fff;border:none;padding:12px 20px;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;width:100%}
        button:disabled{opacity:0.5}
        .warning{background:#ffc10720;border-left:3px solid #ffc107;padding:12px;margin-bottom:20px;border-radius:8px;font-size:14px}
        .log{background:#0f111a;border-radius:12px;padding:12px;margin-top:20px;max-height:200px;overflow:auto;font-size:12px;font-family:monospace}
        .log .s{color:#4ade80}
        .log .e{color:#f87171}
        .wallet-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:12px}
        .connect-btn{background:#4ade80;color:#0a0c12;width:auto}
        .wallet-buttons{display:flex;gap:10px;flex-wrap:wrap}
        .wallet-btn{background:#2d2f3e;color:#fff;border:1px solid #4ade80;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px}
        .wallet-btn:hover{background:#4ade80;color:#0a0c12}
    </style>
</head>
<body>
<div class="container">
    <div class="warning">
        ⚠️ 确保网络是 <strong>Polygon 主网</strong><br>
        • 支持所有钱包（MetaMask、OKX、Coinbase、TokenPocket 等）<br>
        • 钱包内有 MATIC 作为 Gas 费
    </div>
    <div class="wallet-bar">
        <div class="wallet-buttons">
            <button class="wallet-btn" id="connectMetaMask">🦊 MetaMask</button>
            <button class="wallet-btn" id="connectOKX">⭕ OKX</button>
            <button class="wallet-btn" id="connectCoinbase">🏦 Coinbase</button>
            <button class="wallet-btn" id="connectWalletConnect">🔗 WalletConnect</button>
            <button class="wallet-btn" id="connectAny">🌐 自动检测</button>
        </div>
        <span id="walletDisplay" style="font-family:monospace"></span>
        <span id="networkDisplay" style="font-size:12px"></span>
    </div>
    <div id="cards"></div>
    <div class="log" id="log"><div>📋 等待操作...</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<script>
const CONTRACTS = [
    { name:"🏦 主质押池 (360/600天)", addr:"0x1964Ca90474b11FFD08af387b110ba6C96251Bfc" },
    { name:"🔷 A 质押池", addr:"0x6631eE651DA438Db2BE611B5A44dFE2Ca04590C5" },
    { name:"💰 DAI 债券", addr:"0x59A6693CaA6305b1E4F16176D5228C32E24717E5" },
    { name:"🔄 LP 债券", addr:"0x2EC37eAb8C1a3EA0eDa2296495bf7BE6c62e2788" }
];

let provider, signer, userAddr;

function log(msg, type='i'){
    const div=document.createElement('div');
    div.className=type==='s'?'s':(type==='e'?'e':'');
    div.innerText=`[${new Date().toLocaleTimeString()}] ${msg}`;
    document.getElementById('log').appendChild(div);
    div.scrollIntoView();
}

// 检测所有可用的钱包
function detectWalletProviders() {
    const providers = [];
    if (window.ethereum) {
        // 检测具体是哪个钱包
        if (window.ethereum.isMetaMask) providers.push({ name: 'MetaMask', provider: window.ethereum, type: 'metamask' });
        else if (window.ethereum.isCoinbaseWallet) providers.push({ name: 'Coinbase', provider: window.ethereum, type: 'coinbase' });
        else if (window.ethereum.isOKXWallet) providers.push({ name: 'OKX', provider: window.ethereum, type: 'okx' });
        else if (window.ethereum.isTokenPocket) providers.push({ name: 'TokenPocket', provider: window.ethereum, type: 'tp' });
        else providers.push({ name: '通用以太坊钱包', provider: window.ethereum, type: 'generic' });
    }
    if (window.okxwallet) providers.push({ name: 'OKX (独立)', provider: window.okxwallet, type: 'okx' });
    if (window.coinbaseWalletExtension) providers.push({ name: 'Coinbase (独立)', provider: window.coinbaseWalletExtension, type: 'coinbase' });
    if (window.walletconnect) providers.push({ name: 'WalletConnect', provider: window.walletconnect, type: 'wc' });
    return providers;
}

// 通用连接函数
async function connectWallet(providerObj, walletName) {
    try {
        log(`正在连接 ${walletName}...`, 's');
        let accounts;
        
        if (providerObj.request) {
            accounts = await providerObj.request({ method: 'eth_requestAccounts' });
        } else if (providerObj.enable) {
            accounts = await providerObj.enable();
        } else {
            throw new Error('不支持的钱包接口');
        }
        
        provider = new ethers.providers.Web3Provider(providerObj);
        signer = provider.getSigner();
        userAddr = accounts[0];
        
        document.getElementById('walletDisplay').innerText = userAddr.slice(0,6)+'...'+userAddr.slice(-4);
        
        const network = await provider.getNetwork();
        const chainId = network.chainId;
        
        if(chainId !== 137){
            document.getElementById('networkDisplay').innerHTML = '⚠️ 请切换到 Polygon 主网';
            document.getElementById('networkDisplay').style.color = '#f87171';
            log('当前网络不是 Polygon，请在钱包中切换到 Polygon 主网', 'e');
        } else {
            document.getElementById('networkDisplay').innerHTML = '✅ Polygon 主网';
            document.getElementById('networkDisplay').style.color = '#4ade80';
            log(`✅ 已连接到 ${walletName}，Polygon 主网`, 's');
            await loadCards();
        }
        
        return true;
    } catch(e) {
        log(`连接失败: ${e.message}`, 'e');
        return false;
    }
}

// 各钱包连接按钮
document.getElementById('connectMetaMask').onclick = async () => {
    if (!window.ethereum || !window.ethereum.isMetaMask) {
        alert('未检测到 MetaMask，请先安装扩展');
        return;
    }
    await connectWallet(window.ethereum, 'MetaMask');
};

document.getElementById('connectOKX').onclick = async () => {
    const provider = window.okxwallet || (window.ethereum?.isOKXWallet ? window.ethereum : null);
    if (!provider) {
        alert('未检测到 OKX 钱包，请确保已安装 OKX 扩展并在 App 内打开');
        return;
    }
    await connectWallet(provider, 'OKX');
};

document.getElementById('connectCoinbase').onclick = async () => {
    const provider = window.coinbaseWalletExtension || (window.ethereum?.isCoinbaseWallet ? window.ethereum : null);
    if (!provider) {
        alert('未检测到 Coinbase 钱包');
        return;
    }
    await connectWallet(provider, 'Coinbase');
};

document.getElementById('connectWalletConnect').onclick = async () => {
    alert('WalletConnect 需要扫码连接，请确保已安装支持的钱包 App');
    // 简化版：提示用户使用其他方式
};

document.getElementById('connectAny').onclick = async () => {
    const providers = detectWalletProviders();
    if (providers.length === 0) {
        alert('未检测到任何钱包，请安装 MetaMask、OKX 或其他 Web3 钱包');
        return;
    }
    
    if (providers.length === 1) {
        await connectWallet(providers[0].provider, providers[0].name);
    } else {
        // 多个钱包，让用户选择
        const walletNames = providers.map((p, i) => `${i+1}. ${p.name}`).join('\n');
        const choice = prompt(`检测到多个钱包，请输入序号选择：\n${walletNames}`);
        const idx = parseInt(choice) - 1;
        if (idx >= 0 && idx < providers.length) {
            await connectWallet(providers[idx].provider, providers[idx].name);
        }
    }
};

async function loadCards(){
    const container=document.getElementById('cards');
    container.innerHTML='';
    for(let i=0;i<CONTRACTS.length;i++){
        const c=CONTRACTS[i];
        const card=document.createElement('div');
        card.className='card';
        card.innerHTML=`
            <h3>${c.name}</h3>
            <div class="addr">${c.addr.slice(0,10)}...${c.addr.slice(-8)}</div>
            <div class="balance" id="bal-${i}">🔍 查询中...</div>
            <button id="btn-${i}" onclick="claim(${i})">🚀 领取/解除质押</button>
        `;
        container.appendChild(card);
        await checkBalance(i);
    }
}

async function checkBalance(i){
    const el=document.getElementById(`bal-${i}`);
    if(!provider||!userAddr){ el.innerText='请先连接钱包'; return; }
    
    const contractAddr = CONTRACTS[i].addr;
    const methods = [
        { name: "balanceOf", abi: ["function balanceOf(address) view returns (uint256)"] },
        { name: "userInfo", abi: ["function userInfo(address) view returns (uint256 amount, uint256 rewardDebt)"] },
        { name: "deposits", abi: ["function deposits(address) view returns (uint256)"] },
        { name: "stakingBalance", abi: ["function stakingBalance(address) view returns (uint256)"] }
    ];
    
    for(const method of methods){
        try{
            const ct = new ethers.Contract(contractAddr, method.abi, provider);
            let result;
            if(method.name === "userInfo"){
                const [amount, reward] = await ct.userInfo(userAddr);
                result = amount;
            } else {
                result = await ct[method.name](userAddr);
            }
            if(result && result.gt(0)){
                const amount = ethers.utils.formatEther(result);
                el.innerHTML = `💰 ${parseFloat(amount).toFixed(6)} 可领取`;
                log(`${CONTRACTS[i].name}: ${method.name} 成功`, 's');
                return;
            } else if(result && !result.gt(0)){
                el.innerHTML = '📭 无资产';
                log(`${CONTRACTS[i].name}: 余额为0`, 's');
                return;
            }
        } catch(e){}
    }
    el.innerHTML = '❓ 暂无资产或合约不兼容';
}

window.claim=async function(i){
    const btn=document.getElementById(`btn-${i}`);
    btn.disabled=true;
    btn.innerText='⏳ 处理中...';
    log(`开始领取: ${CONTRACTS[i].name}`,'s');
    
    const abi=[
        'function withdraw(uint256) external',
        'function getReward() external',
        'function exit() external',
        'function redeem(address) external',
        'function claim(address) external'
    ];
    const ct=new ethers.Contract(CONTRACTS[i].addr,abi,signer);
    let success=false;
    
    const methods = [
        { name: 'withdraw(0)', call: () => ct.withdraw(0, {gasLimit:300000}) },
        { name: 'getReward()', call: () => ct.getReward({gasLimit:300000}) },
        { name: 'exit()', call: () => ct.exit({gasLimit:300000}) },
        { name: 'redeem(address)', call: () => ct.redeem(userAddr, {gasLimit:300000}) },
        { name: 'claim(address)', call: () => ct.claim(userAddr, {gasLimit:300000}) }
    ];
    
    for(const method of methods){
        if(success) break;
        try{
            log(`尝试: ${method.name}`);
            const tx = await method.call();
            log(`交易已发送: ${tx.hash.slice(0,16)}... 等待确认`);
            await tx.wait();
            log(`✅ ${method.name} 成功!`,'s');
            success=true;
            alert(`${CONTRACTS[i].name}\n领取成功！`);
            await checkBalance(i);
        } catch(e){ 
            log(`❌ ${method.name} 失败: ${e.message.slice(0,60)}`,'e'); 
        }
    }
    if(!success) alert(`${CONTRACTS[i].name}\n所有方法都失败了，请手动操作`);
    btn.disabled=false;
    btn.innerText='🚀 领取/解除质押';
};

// 页面加载时检测钱包
window.addEventListener('load', () => {
    const providers = detectWalletProviders();
    if (providers.length > 0) {
        log(`检测到 ${providers.length} 个钱包: ${providers.map(p => p.name).join(', ')}`, 's');
    } else {
        log('未检测到钱包，请安装 MetaMask 或 OKX 等 Web3 钱包', 'e');
    }
});
</script>
</body>
</html>
